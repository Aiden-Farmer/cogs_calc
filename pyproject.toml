[project]
name = "cogs-calc"
version = "0.1.0"
description = "Weighted-average inventory cost and asset valuation from Excel exports."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "msoffcrypto-tool>=6.0.0",
    "mypy>=2.3.0",
    "openpyxl>=3.1.5",
    "openpyxl-stubs>=0.1.25",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "tqdm>=4.70.0",
    "typeguard>=4.5.2",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
omit = ["src/transfers/*", "tests/*", "conftest.py", ".venv/*"]

[tool.coverage.report]
fail_under = 80
